name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Check the UI script parses
        run: node --check PuulaakiLiiga/wwwroot/app.js

      # Fails when the entities were changed without adding a migration.
      - name: Check migrations match the model
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations has-pending-model-changes \
            --project TeamManagerClassLibrary --startup-project PuulaakiLiiga --configuration Release --no-build --context LeagueContext

      # Starts the real app on a fresh database and checks the first-run flow end to end.
      - name: Smoke test
        env:
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__Default: Data Source=${{ runner.temp }}/ci.db
          Auth__SecureCookies: 'false'   # the smoke test talks plain http
        run: |
          dotnet run --no-build --no-launch-profile -c Release --project PuulaakiLiiga > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:5000/api/auth/me && break; sleep 1; done
          test "$(curl -s http://localhost:5000/api/auth/me)" = '{"needsSetup":true}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/data)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/)" = 200
          curl -sf -c "$RUNNER_TEMP/jar" -H 'content-type: application/json' \
            -d '{"username":"ci-admin","password":"ci-password-123"}' http://localhost:5000/api/auth/setup
          test "$(curl -s -b "$RUNNER_TEMP/jar" -o /dev/null -w '%{http_code}' http://localhost:5000/api/data)" = 200
      - name: App log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/app.log" || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
